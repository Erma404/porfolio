<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin — Espace client</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/espace-client.css?v=2"/>
</head>
<body>
<div id="login-view" class="standalone">
  <div class="wrap">
    <h1 style="font-family:var(--serif);font-weight:400;font-size:28px">Admin</h1>
    <p class="sub">Connexion réservée.</p>
    <div id="login-msg"></div>
    <form id="login-form" class="card">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email"/>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password"/>
      <button type="submit" class="btn-primary" id="login-btn">Se connecter</button>
    </form>

    <form id="setpass-form" class="card hidden">
      <p class="sub" style="margin-bottom:16px">Invitation confirmée — définissez votre mot de passe admin.</p>
      <label for="setpass">Mot de passe</label>
      <input type="password" id="setpass" required minlength="8" autocomplete="new-password"/>
      <button type="submit" class="btn-primary" id="setpass-btn">Définir mon mot de passe</button>
    </form>
  </div>
</div>

<div class="app-shell hidden" id="admin-view">
  <div class="overlay" id="overlay"></div>
  <aside class="app-sidebar" id="sidebar">
    <div class="app-brand">
      <div class="avatar" style="background:var(--text)">EM</div>
      <div class="app-brand-text">
        <div class="app-brand-name">Ernestine Matjabo</div>
        <div class="app-brand-sub">Admin — Espace client</div>
      </div>
    </div>
    <nav class="app-nav">
      <a href="/admin/" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Clients
      </a>
    </nav>
    <div class="app-sidebar-bottom">
      <a href="#" class="nav-item" id="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Déconnexion
      </a>
    </div>
  </aside>

  <div class="app-main">
    <div class="app-topbar">
      <button class="menu-btn" id="menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
      </button>
      <strong style="font-size:14px">Clients</strong>
    </div>
    <div class="app-content">
      <div class="app-content-inner" style="max-width:1080px">
        <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div>
            <h1>Clients</h1>
            <p class="sub" id="clients-count">Chargement…</p>
          </div>
          <button class="btn-primary" style="width:auto" id="new-client-btn">+ Nouveau client</button>
        </div>

        <div class="section-card hidden" id="create-card">
          <div class="section-head">
            <h2>Nouveau client</h2>
            <a href="#" id="create-cancel">Annuler</a>
          </div>
          <div id="create-msg"></div>
          <form id="create-form">
            <label for="nom">Nom</label>
            <input type="text" id="nom" required/>
            <label for="c-email">Email</label>
            <input type="email" id="c-email" required/>
            <label for="nom_projet">Nom du projet</label>
            <input type="text" id="nom_projet" required/>
            <button type="submit" class="btn-primary" id="create-btn">Créer le client et envoyer les accès</button>
          </form>
        </div>

        <div class="filter-tabs" id="filter-tabs"></div>
        <div class="project-grid" id="clients-list">
          <p class="sub">Chargement…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { supabase, callFunction } from '/assets/supabase-client.js';

const ADMIN_EMAIL = 'ernestinemtb@gmail.com';
const loginView = document.getElementById('login-view');
const adminView = document.getElementById('admin-view');

const AVATAR_COLORS = ['#5b4cf5', '#2f8f5b', '#c2762c', '#c23c5e', '#2e83c2', '#7c6cfa'];
function colorFor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(nom) {
  return nom.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
}

let allClients = [];
let activeFilter = 'tous';

function renderFilters() {
  const counts = { tous: allClients.length };
  allClients.forEach((c) => { counts[c.statut] = (counts[c.statut] || 0) + 1; });
  const labels = { tous: 'Tous', onboarding: 'Onboarding', actif: 'Actif', archive: 'Archivé' };
  const order = ['tous', 'onboarding', 'actif', 'archive'].filter((k) => counts[k]);
  document.getElementById('filter-tabs').innerHTML = order.map((k) => `
    <button class="filter-tab ${k === activeFilter ? 'active' : ''}" data-filter="${k}">${labels[k] || k} · ${counts[k]}</button>
  `).join('');
  document.querySelectorAll('.filter-tab').forEach((btn) => {
    btn.addEventListener('click', () => { activeFilter = btn.dataset.filter; renderFilters(); renderList(); });
  });
}

function renderList() {
  const list = document.getElementById('clients-list');
  const visible = activeFilter === 'tous' ? allClients : allClients.filter((c) => c.statut === activeFilter);
  document.getElementById('clients-count').textContent = `${allClients.length} projet${allClients.length > 1 ? 's' : ''} en portefeuille`;

  if (visible.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>Aucun client dans cette catégorie.</p></div>';
    return;
  }
  list.innerHTML = visible.map((c) => `
    <div class="project-card" data-id="${c.id}">
      <div class="project-card-head">
        <div class="avatar" style="background:${colorFor(c.nom)}">${initials(c.nom)}</div>
        <div style="min-width:0">
          <div class="project-card-name">${c.nom}</div>
          <div class="project-card-sub">${c.nom_projet}</div>
        </div>
      </div>
      ${c.phasesTotal ? `
        <div class="project-card-progress-row"><span>${c.phaseActuelle || ''}</span><span>${c.phasesDone}/${c.phasesTotal}</span></div>
        <div class="progress"><div class="progress-bar ${c.phasesDone === c.phasesTotal ? 'success' : ''}" style="width:${Math.round((c.phasesDone / c.phasesTotal) * 100)}%"></div></div>
      ` : '<p class="sub" style="margin:8px 0 0;font-size:12.5px">Pas encore de phase.</p>'}
      <div class="project-card-foot">
        <span class="badge ${c.statut}">${c.statut}</span>
        <span class="meta">${new Date(c.created_at).toLocaleDateString('fr-FR')}</span>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.project-card').forEach((card) => {
    card.addEventListener('click', () => { window.location.href = `/admin/client/?id=${card.dataset.id}`; });
  });
}

async function renderClients() {
  const { data: clients, error } = await supabase
    .from('clients')
    .select('id, nom, email, nom_projet, statut, created_at')
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('clients-list').innerHTML = `<div class="msg error">${error.message}</div>`;
    return;
  }

  allClients = clients || [];

  const clientIds = allClients.map((c) => c.id);
  const { data: projects } = clientIds.length
    ? await supabase.from('projects').select('id, client_id, phase_actuelle').in('client_id', clientIds)
    : { data: [] };

  const projectIds = (projects || []).map((p) => p.id);
  const { data: phases } = projectIds.length
    ? await supabase.from('project_phases').select('project_id, statut').in('project_id', projectIds)
    : { data: [] };

  allClients.forEach((c) => {
    const project = (projects || []).find((p) => p.client_id === c.id);
    const projectPhases = project ? (phases || []).filter((p) => p.project_id === project.id) : [];
    c.phaseActuelle = project?.phase_actuelle;
    c.phasesTotal = projectPhases.length;
    c.phasesDone = projectPhases.filter((p) => p.statut === 'terminee').length;
  });

  renderFilters();
  renderList();
}

async function checkAdmin() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session && session.user.email === ADMIN_EMAIL) {
    loginView.classList.add('hidden');
    adminView.classList.remove('hidden');
    renderClients();
  } else if (session) {
    await supabase.auth.signOut();
  }
}

if (location.hash.includes('type=invite') || location.hash.includes('type=recovery')) {
  const { data: { session } } = await supabase.auth.getSession();
  if (session && session.user.email === ADMIN_EMAIL) {
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('setpass-form').classList.remove('hidden');
  }
} else {
  await checkAdmin();
}

document.getElementById('setpass-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('setpass-btn');
  btn.disabled = true;
  const { error } = await supabase.auth.updateUser({ password: document.getElementById('setpass').value });
  btn.disabled = false;
  if (error) {
    alert(error.message);
    return;
  }
  history.replaceState(null, '', location.pathname);
  document.getElementById('setpass-form').classList.add('hidden');
  await checkAdmin();
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgBox = document.getElementById('login-msg');
  msgBox.innerHTML = '';
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error || data.user.email !== ADMIN_EMAIL) {
    if (!error) await supabase.auth.signOut();
    msgBox.innerHTML = '<div class="msg error">Accès refusé.</div>';
    return;
  }
  await checkAdmin();
});

document.getElementById('new-client-btn').addEventListener('click', () => {
  document.getElementById('create-card').classList.toggle('hidden');
});
document.getElementById('create-cancel').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('create-card').classList.add('hidden');
});

document.getElementById('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgBox = document.getElementById('create-msg');
  msgBox.innerHTML = '';
  const btn = document.getElementById('create-btn');
  btn.disabled = true;

  const nom = document.getElementById('nom').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const nom_projet = document.getElementById('nom_projet').value.trim();

  try {
    await callFunction('create-client', { nom, email, nom_projet });
    msgBox.innerHTML = '<div class="msg success">Client créé, accès envoyés par email.</div>';
    document.getElementById('create-form').reset();
    document.getElementById('create-card').classList.add('hidden');
    renderClients();
  } catch (err) {
    msgBox.innerHTML = `<div class="msg error">${err.message}</div>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  location.reload();
});
document.getElementById('menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
});
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
});
</script>
</body>
</html>
