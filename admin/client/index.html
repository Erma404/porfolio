<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fiche client — Admin</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/espace-client.css"/>
</head>
<body>
<div class="app-shell">
  <div class="overlay" id="overlay"></div>
  <aside class="app-sidebar" id="sidebar">
    <div class="app-brand">
      <div class="avatar" style="background:var(--text)">EM</div>
      <div class="app-brand-text">
        <div class="app-brand-name">Ernestine Matjabo</div>
        <div class="app-brand-sub">Admin — Espace client</div>
      </div>
    </div>
    <nav class="app-nav">
      <a href="/admin/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Clients
      </a>
    </nav>
    <div class="app-sidebar-bottom">
      <a href="#" class="nav-item" id="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Déconnexion
      </a>
    </div>
  </aside>

  <div class="app-main">
    <div class="app-topbar">
      <button class="menu-btn" id="menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
      </button>
      <strong style="font-size:14px">Fiche client</strong>
    </div>
    <div class="app-content">
      <div class="app-content-inner" id="content">
        <p class="sub">Chargement…</p>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { supabase, requireAdminSession, callFunction } from '/assets/supabase-client.js';

const ICON_IMAGE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 20"/></svg>';
const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>';
const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
const ICON_CHEVRON = '<svg class="timeline-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const ICON_GRIP = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>';
const IMAGE_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];
function fileIcon(nom) {
  const ext = (nom.split('.').pop() || '').toLowerCase();
  return IMAGE_EXT.includes(ext) ? ICON_IMAGE : ICON_DOC;
}
function initials(nom) {
  return nom.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
}
function formatBytes(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  return kb < 1024 ? `${Math.round(kb)} Ko` : `${(kb / 1024).toFixed(1)} Mo`;
}
function money(n) {
  return Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
async function downloadPath(path, btn) {
  btn.disabled = true;
  const { data, error } = await supabase.storage.from('client-files').createSignedUrl(path, 60);
  btn.disabled = false;
  if (error || !data) { alert('Impossible de générer le lien de téléchargement.'); return; }
  window.open(data.signedUrl, '_blank');
}

const session = await requireAdminSession();
if (session) {
  const params = new URLSearchParams(location.search);
  const clientId = params.get('id');
  const content = document.getElementById('content');

  if (!clientId) {
    content.innerHTML = '<div class="msg error">Client introuvable.</div>';
  } else {
    await render();
  }

  async function render() {
    const { data: client } = await supabase.from('clients').select('*').eq('id', clientId).single();
    const { data: project } = await supabase.from('projects').select('*').eq('client_id', clientId).single();
    const { data: phases } = project
      ? await supabase.from('project_phases').select('*').eq('project_id', project.id).order('ordre')
      : { data: [] };
    const { data: files } = project
      ? await supabase.from('files').select('*').eq('project_id', project.id).is('phase_id', null).order('date_upload', { ascending: false })
      : { data: [] };
    const { data: quotes } = project
      ? await supabase.from('quotes').select('*').eq('project_id', project.id).order('created_at', { ascending: false })
      : { data: [] };
    const { data: invoices } = project
      ? await supabase.from('invoices').select('*').eq('project_id', project.id).order('created_at', { ascending: false })
      : { data: [] };

    content.innerHTML = `
      <p class="sub" style="margin-bottom:16px"><a href="/admin/">← Clients</a></p>
      <div class="page-header" style="display:flex;align-items:center;gap:14px">
        <div class="avatar" style="width:44px;height:44px;font-size:15px;background:var(--accent)">${initials(client.nom)}</div>
        <div>
          <h1 style="margin:0">${client.nom}</h1>
          <p class="sub" style="margin:2px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${client.email} · ${client.nom_projet} ·
            <select class="badge ${client.statut}" id="client-statut">
              <option value="onboarding" ${client.statut === 'onboarding' ? 'selected' : ''}>onboarding</option>
              <option value="actif" ${client.statut === 'actif' ? 'selected' : ''}>actif</option>
              <option value="archive" ${client.statut === 'archive' ? 'selected' : ''}>archivé</option>
            </select>
          </p>
        </div>
      </div>

      <div class="section-card">
        <div class="section-head"><h2>Phases</h2></div>
        <div id="phases-list">
          ${(phases || []).map((p, i) => `
            <div class="timeline-item ${p.statut}" data-phase-id="${p.id}" style="padding-bottom:0;border-bottom:1px solid var(--border)">
              <div class="timeline-body" style="padding:14px 0;display:flex;align-items:flex-start;gap:8px">
                <div class="drag-handle" draggable="true" data-phase-id="${p.id}" title="Glisser pour réordonner">${ICON_GRIP}</div>
                <div style="flex:1;min-width:0">
                  <div class="timeline-title-row" data-toggle="${p.id}" style="cursor:pointer">
                    <span class="timeline-title"><span class="timeline-num">${i + 1}.</span>${p.nom_phase}</span>
                    <div style="display:flex;align-items:center;gap:10px">
                      <select class="badge ${p.statut}" data-phase-id="${p.id}" data-phase-nom="${p.nom_phase}" onclick="event.stopPropagation()">
                        <option value="a_venir" ${p.statut === 'a_venir' ? 'selected' : ''}>à venir</option>
                        <option value="en_cours" ${p.statut === 'en_cours' ? 'selected' : ''}>en cours</option>
                        <option value="terminee" ${p.statut === 'terminee' ? 'selected' : ''}>terminée</option>
                      </select>
                      ${ICON_CHEVRON}
                    </div>
                  </div>
                  <div class="phase-detail hidden" id="detail-${p.id}"></div>
                </div>
              </div>
            </div>
          `).join('') || '<p class="sub" style="margin:0">Aucune phase.</p>'}
        </div>
        <form id="add-phase-form" style="margin-top:16px;display:flex;gap:8px;align-items:flex-end">
          <div style="flex:1"><label for="nom_phase">Nouvelle phase</label><input type="text" id="nom_phase" required style="margin:0"/></div>
          <button type="submit" class="btn-secondary">Ajouter</button>
        </form>
      </div>

      <div class="section-card">
        <div class="section-head"><h2>Fichiers du projet</h2></div>
        <div class="file-list" id="files-list">
          ${(files || []).map((f) => `
            <div class="file-item">
              <div class="file-icon">${fileIcon(f.nom)}</div>
              <div class="file-info">
                <div class="file-name">${f.nom}</div>
                <div class="file-meta">${f.type}${f.size_bytes ? ' · ' + formatBytes(f.size_bytes) : ''} · ${new Date(f.date_upload).toLocaleDateString('fr-FR')}</div>
              </div>
              <div class="file-actions">
                <button class="file-download" data-path="${f.storage_path}" title="Télécharger">${ICON_DOWNLOAD}</button>
                <button class="file-download file-delete" data-file-id="${f.id}" data-path="${f.storage_path}" title="Supprimer">${ICON_TRASH}</button>
              </div>
            </div>
          `).join('') || '<p class="sub" style="margin:0">Aucun fichier.</p>'}
        </div>
        <form id="upload-form" style="margin-top:16px">
          <label for="file-input">Ajouter un fichier</label>
          <input type="file" id="file-input" required style="margin-bottom:16px"/>
          <button type="submit" class="btn-primary" id="upload-btn" style="width:auto">Uploader et notifier le client</button>
        </form>
      </div>

      <div class="section-card">
        <div class="section-head"><h2>Devis</h2></div>
        <div id="quotes-list">
          ${(quotes || []).map((q) => `
            <div class="doc-item">
              <div class="file-icon">${ICON_DOC}</div>
              <div class="file-info">
                <div class="doc-amount">${money(q.montant)}</div>
                <div class="doc-meta">${new Date(q.created_at).toLocaleDateString('fr-FR')}</div>
              </div>
              <select class="badge ${q.statut}" data-quote-id="${q.id}">
                <option value="envoye" ${q.statut === 'envoye' ? 'selected' : ''}>envoyé</option>
                <option value="accepte" ${q.statut === 'accepte' ? 'selected' : ''}>accepté</option>
                <option value="refuse" ${q.statut === 'refuse' ? 'selected' : ''}>refusé</option>
              </select>
              <button class="file-download" data-path="${q.storage_path}" title="Télécharger">${ICON_DOWNLOAD}</button>
            </div>
          `).join('') || '<p class="sub" style="margin:0">Aucun devis.</p>'}
        </div>
        <form id="quote-form" style="margin-top:16px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
          <div><label for="quote-montant">Montant (€)</label><input type="text" inputmode="decimal" id="quote-montant" required style="margin:0;width:120px"/></div>
          <div style="flex:1;min-width:180px"><label for="quote-file">Fichier PDF</label><input type="file" id="quote-file" accept="application/pdf" required style="margin:0"/></div>
          <button type="submit" class="btn-primary" style="width:auto">Envoyer le devis</button>
        </form>
      </div>

      <div class="section-card">
        <div class="section-head"><h2>Factures</h2></div>
        <div id="invoices-list">
          ${(invoices || []).map((inv) => `
            <div class="doc-item">
              <div class="file-icon">${ICON_DOC}</div>
              <div class="file-info">
                <div class="doc-amount">${money(inv.montant)}</div>
                <div class="doc-meta">${new Date(inv.created_at).toLocaleDateString('fr-FR')}</div>
              </div>
              <select class="badge ${inv.statut}" data-invoice-id="${inv.id}">
                <option value="envoyee" ${inv.statut === 'envoyee' ? 'selected' : ''}>envoyée</option>
                <option value="payee" ${inv.statut === 'payee' ? 'selected' : ''}>payée</option>
              </select>
              <button class="file-download" data-path="${inv.storage_path}" title="Télécharger">${ICON_DOWNLOAD}</button>
            </div>
          `).join('') || '<p class="sub" style="margin:0">Aucune facture.</p>'}
        </div>
        <form id="invoice-form" style="margin-top:16px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
          <div><label for="invoice-montant">Montant (€)</label><input type="text" inputmode="decimal" id="invoice-montant" required style="margin:0;width:120px"/></div>
          <div style="flex:1;min-width:180px"><label for="invoice-file">Fichier PDF</label><input type="file" id="invoice-file" accept="application/pdf" required style="margin:0"/></div>
          <button type="submit" class="btn-primary" style="width:auto">Envoyer la facture</button>
        </form>
      </div>
    `;

    document.getElementById('client-statut').addEventListener('change', async (e) => {
      const sel = e.target;
      sel.disabled = true;
      await supabase.from('clients').update({ statut: sel.value }).eq('id', clientId);
      sel.classList.remove('onboarding', 'actif', 'archive');
      sel.classList.add(sel.value);
      sel.disabled = false;
    });

    // ── Phases : statut + détail (notes + fichiers de phase) ──────────────
    content.querySelectorAll('select[data-phase-id]').forEach((sel) => {
      sel.addEventListener('change', async () => {
        sel.disabled = true;
        const phaseId = sel.dataset.phaseId;
        const nomPhase = sel.dataset.phaseNom;
        const statut = sel.value;
        await supabase.from('project_phases').update({ statut, date_maj: new Date().toISOString() }).eq('id', phaseId);
        if (statut === 'en_cours') {
          await supabase.from('projects').update({ phase_actuelle: nomPhase }).eq('id', project.id);
        }
        try {
          await callFunction('notify-update', { client_id: clientId, type: 'phase_update', nom_phase: nomPhase, statut });
        } catch {}
        sel.classList.remove('a_venir', 'en_cours', 'terminee');
        sel.classList.add(statut);
        sel.closest('.timeline-item').className = `timeline-item ${statut}`;
        sel.disabled = false;
      });
    });

    let draggedPhaseId = null;

    content.querySelectorAll('.drag-handle').forEach((handle) => {
      handle.addEventListener('dragstart', (e) => {
        draggedPhaseId = handle.dataset.phaseId;
        e.dataTransfer.effectAllowed = 'move';
        handle.closest('.timeline-item').classList.add('dragging');
      });
      handle.addEventListener('dragend', () => {
        handle.closest('.timeline-item').classList.remove('dragging');
        content.querySelectorAll('.timeline-item').forEach((it) => it.classList.remove('drag-over'));
      });
    });

    content.querySelectorAll('.timeline-item[data-phase-id]').forEach((item) => {
      item.addEventListener('dragover', (e) => {
        if (!draggedPhaseId) return;
        e.preventDefault();
        item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', async (e) => {
        e.preventDefault();
        item.classList.remove('drag-over');
        const targetId = item.dataset.phaseId;
        if (!draggedPhaseId || draggedPhaseId === targetId) return;

        const ids = phases.map((p) => p.id);
        const fromIdx = ids.indexOf(draggedPhaseId);
        const toIdx = ids.indexOf(targetId);
        ids.splice(fromIdx, 1);
        ids.splice(toIdx, 0, draggedPhaseId);
        draggedPhaseId = null;

        await Promise.all(ids.map((id, idx) => supabase.from('project_phases').update({ ordre: idx + 1 }).eq('id', id)));
        await render();
      });
    });

    async function renderPhaseDetail(phaseId) {
      const box = document.getElementById(`detail-${phaseId}`);
      box.innerHTML = '<p class="sub" style="margin:0">Chargement…</p>';

      const [{ data: notes }, { data: phaseFiles }] = await Promise.all([
        supabase.from('project_phase_notes').select('id, contenu, created_at').eq('phase_id', phaseId).order('created_at', { ascending: false }),
        supabase.from('files').select('id, nom, type, storage_path, date_upload, size_bytes').eq('phase_id', phaseId).order('date_upload', { ascending: false }),
      ]);

      box.innerHTML = `
        <div class="phase-detail-section">
          <div class="phase-detail-label">Comptes-rendus</div>
          <div id="notes-${phaseId}">
            ${(notes || []).length === 0 ? '<p class="sub" style="margin:0;font-size:13px">Aucune note pour l\'instant.</p>' : (notes || []).map((n) => `
              <div class="note-item">
                <div>${n.contenu}</div>
                <div class="meta">${new Date(n.created_at).toLocaleDateString('fr-FR')}</div>
              </div>
            `).join('')}
          </div>
          <form class="note-form" data-phase-id="${phaseId}" style="margin-top:12px;display:flex;gap:8px;align-items:flex-end">
            <div style="flex:1"><label>Ajouter une note</label><input type="text" required style="margin:0"/></div>
            <button type="submit" class="btn-secondary">Ajouter</button>
          </form>
        </div>
        <div class="phase-detail-section">
          <div class="phase-detail-label">Fichiers de cette phase</div>
          <div class="file-list">
            ${(phaseFiles || []).length === 0 ? '<p class="sub" style="margin:0;font-size:13px">Aucun fichier.</p>' : (phaseFiles || []).map((f) => `
              <div class="file-item">
                <div class="file-icon">${fileIcon(f.nom)}</div>
                <div class="file-info">
                  <div class="file-name">${f.nom}</div>
                  <div class="file-meta">${formatBytes(f.size_bytes)}${f.size_bytes ? ' · ' : ''}${new Date(f.date_upload).toLocaleDateString('fr-FR')}</div>
                </div>
                <div class="file-actions">
                  <button class="file-download" data-path="${f.storage_path}" title="Télécharger">${ICON_DOWNLOAD}</button>
                  <button class="file-download file-delete" data-file-id="${f.id}" data-path="${f.storage_path}" title="Supprimer">${ICON_TRASH}</button>
                </div>
              </div>
            `).join('')}
          </div>
          <form class="phase-upload-form" data-phase-id="${phaseId}" style="margin-top:12px">
            <input type="file" required style="margin-bottom:10px"/>
            <button type="submit" class="btn-secondary">Ajouter un fichier</button>
          </form>
        </div>
      `;

      box.querySelectorAll('.file-download[data-path]:not(.file-delete)').forEach((btn) => {
        btn.addEventListener('click', () => downloadPath(btn.dataset.path, btn));
      });
      box.querySelectorAll('.file-delete').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Supprimer ce fichier ?')) return;
          btn.disabled = true;
          await supabase.storage.from('client-files').remove([btn.dataset.path]);
          await supabase.from('files').delete().eq('id', btn.dataset.fileId);
          renderPhaseDetail(phaseId);
        });
      });
      box.querySelector('.note-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = e.target.querySelector('input[type=text]');
        const contenu = input.value.trim();
        if (!contenu) return;
        await supabase.from('project_phase_notes').insert({ phase_id: phaseId, contenu });
        renderPhaseDetail(phaseId);
      });
      box.querySelector('.phase-upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = e.target.querySelector('input[type=file]');
        const file = fileInput.files[0];
        if (!file) return;
        const path = `${project.id}/${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabase.storage.from('client-files').upload(path, file);
        if (uploadError) { alert(uploadError.message); return; }
        await supabase.from('files').insert({
          project_id: project.id, phase_id: phaseId, type: 'fichier', nom: file.name,
          storage_path: path, size_bytes: file.size,
        });
        renderPhaseDetail(phaseId);
      });
    }

    content.querySelectorAll('.timeline-title-row[data-toggle]').forEach((row) => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('select')) return;
        const phaseId = row.dataset.toggle;
        const item = row.closest('.timeline-item');
        const box = document.getElementById(`detail-${phaseId}`);
        const wasHidden = box.classList.contains('hidden');
        box.classList.toggle('hidden');
        item.classList.toggle('expanded', wasHidden);
        if (wasHidden) renderPhaseDetail(phaseId);
      });
    });

    document.getElementById('add-phase-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nomPhase = document.getElementById('nom_phase').value.trim();
      const nextOrdre = phases.length ? Math.max(...phases.map((p) => p.ordre)) + 1 : 1;
      await supabase.from('project_phases').insert({ project_id: project.id, nom_phase: nomPhase, statut: 'a_venir', ordre: nextOrdre });
      await render();
    });

    // ── Fichiers du projet (hors phase) ────────────────────────────────────
    content.querySelectorAll('#files-list .file-download[data-path]:not(.file-delete)').forEach((btn) => {
      btn.addEventListener('click', () => downloadPath(btn.dataset.path, btn));
    });
    content.querySelectorAll('#files-list .file-delete').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Supprimer ce fichier ?')) return;
        btn.disabled = true;
        await supabase.storage.from('client-files').remove([btn.dataset.path]);
        await supabase.from('files').delete().eq('id', btn.dataset.fileId);
        await render();
      });
    });

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('upload-btn');
      btn.disabled = true;
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      const path = `${project.id}/${Date.now()}_${file.name}`;

      const { error: uploadError } = await supabase.storage.from('client-files').upload(path, file);
      if (uploadError) {
        alert(uploadError.message);
        btn.disabled = false;
        return;
      }
      await supabase.from('files').insert({ project_id: project.id, type: 'fichier', nom: file.name, storage_path: path, size_bytes: file.size });
      try {
        await callFunction('notify-update', { client_id: clientId, type: 'new_file', nom_fichier: file.name });
      } catch {}
      btn.disabled = false;
      await render();
    });

    // ── Devis ───────────────────────────────────────────────────────────
    content.querySelectorAll('#quotes-list .file-download[data-path]').forEach((btn) => {
      btn.addEventListener('click', () => downloadPath(btn.dataset.path, btn));
    });
    content.querySelectorAll('select[data-quote-id]').forEach((sel) => {
      sel.addEventListener('change', async () => {
        sel.disabled = true;
        await supabase.from('quotes').update({ statut: sel.value }).eq('id', sel.dataset.quoteId);
        sel.classList.remove('envoye', 'accepte', 'refuse');
        sel.classList.add(sel.value);
        sel.disabled = false;
      });
    });
    document.getElementById('quote-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const montant = parseFloat(document.getElementById('quote-montant').value.replace(',', '.'));
      const file = document.getElementById('quote-file').files[0];
      if (!file || isNaN(montant)) return;
      const path = `${project.id}/quotes/${Date.now()}_${file.name}`;
      const { error: uploadError } = await supabase.storage.from('client-files').upload(path, file);
      if (uploadError) { alert(uploadError.message); return; }
      await supabase.from('quotes').insert({ project_id: project.id, montant, storage_path: path });
      try {
        await callFunction('notify-update', { client_id: clientId, type: 'new_quote', montant });
      } catch {}
      await render();
    });

    // ── Factures ────────────────────────────────────────────────────────
    content.querySelectorAll('#invoices-list .file-download[data-path]').forEach((btn) => {
      btn.addEventListener('click', () => downloadPath(btn.dataset.path, btn));
    });
    content.querySelectorAll('select[data-invoice-id]').forEach((sel) => {
      sel.addEventListener('change', async () => {
        sel.disabled = true;
        await supabase.from('invoices').update({ statut: sel.value }).eq('id', sel.dataset.invoiceId);
        sel.classList.remove('envoyee', 'payee');
        sel.classList.add(sel.value);
        sel.disabled = false;
      });
    });
    document.getElementById('invoice-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const montant = parseFloat(document.getElementById('invoice-montant').value.replace(',', '.'));
      const file = document.getElementById('invoice-file').files[0];
      if (!file || isNaN(montant)) return;
      const path = `${project.id}/invoices/${Date.now()}_${file.name}`;
      const { error: uploadError } = await supabase.storage.from('client-files').upload(path, file);
      if (uploadError) { alert(uploadError.message); return; }
      await supabase.from('invoices').insert({ project_id: project.id, montant, storage_path: path });
      try {
        await callFunction('notify-update', { client_id: clientId, type: 'new_invoice', montant });
      } catch {}
      await render();
    });
  }
}

document.getElementById('logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  window.location.href = '/admin/';
});
document.getElementById('menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
});
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
});
</script>
</body>
</html>
