<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Projet — Espace client</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/espace-client.css?v=4"/>
</head>
<body>
<div class="app-shell">
  <div class="overlay" id="overlay"></div>
  <aside class="app-sidebar" id="sidebar">
    <div class="app-brand">
      <div class="avatar" id="brand-avatar">··</div>
      <div class="app-brand-text">
        <div class="app-brand-name" id="brand-name">Chargement…</div>
        <div class="app-brand-sub" id="brand-sub"></div>
      </div>
    </div>
    <nav class="app-nav">
      <a href="/espace-client/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Tableau de bord
      </a>
      <a href="/espace-client/projet/" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="m3 6 1.5 1.5L7 5"/><path d="m3 12 1.5 1.5L7 11"/><path d="m3 18 1.5 1.5L7 17"/></svg>
        Projet
      </a>
      <a href="/espace-client/fichiers/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
        Fichiers
      </a>
      <a href="/espace-client/devis-factures/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        Devis &amp; factures
      </a>
    </nav>
    <div class="app-sidebar-bottom">
      <a href="#" class="nav-item" id="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Déconnexion
      </a>
    </div>
  </aside>

  <div class="app-main">
    <div class="app-topbar">
      <button class="menu-btn" id="menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
      </button>
      <strong style="font-size:14px">Projet</strong>
    </div>
    <div class="app-content">
      <div class="app-content-inner" id="content">
        <p class="sub">Chargement…</p>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { supabase, requireSession } from '/assets/supabase-client.js';

const ICON_IMAGE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 20"/></svg>';
const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>';
const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_CHEVRON = '<svg class="timeline-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const IMAGE_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];
function fileIcon(nom) {
  const ext = (nom.split('.').pop() || '').toLowerCase();
  return IMAGE_EXT.includes(ext) ? ICON_IMAGE : ICON_DOC;
}
function initials(nom) {
  return nom.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
}

// Confirmation de suppression sans dialogue natif (window.confirm bloque tout
// le rendu de la page) : premier clic arme le bouton (rouge, 3s), second clic confirme.
function wireDeleteConfirm(btn, onConfirm) {
  let timeout;
  btn.addEventListener('click', () => {
    if (btn.dataset.armed !== 'true') {
      btn.dataset.armed = 'true';
      btn.classList.add('confirm-armed');
      timeout = setTimeout(() => {
        btn.dataset.armed = 'false';
        btn.classList.remove('confirm-armed');
      }, 3000);
      return;
    }
    clearTimeout(timeout);
    btn.disabled = true;
    onConfirm();
  });
}
function formatBytes(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  return kb < 1024 ? `${Math.round(kb)} Ko` : `${(kb / 1024).toFixed(1)} Mo`;
}

const session = await requireSession('/espace-client/connexion/');
if (session) {
  const content = document.getElementById('content');
  const userId = session.user.id;

  const { data: client } = await supabase
    .from('clients')
    .select('id, nom, nom_projet')
    .eq('auth_user_id', session.user.id)
    .single();

  if (client) {
    document.getElementById('brand-avatar').textContent = initials(client.nom);
    document.getElementById('brand-name').textContent = client.nom;
    document.getElementById('brand-sub').textContent = client.nom_projet;
  }

  const { data: project } = client
    ? await supabase.from('projects').select('id, nom').eq('client_id', client.id).single()
    : { data: null };

  const { data: phases } = project
    ? await supabase
        .from('project_phases')
        .select('id, nom_phase, statut, date_maj')
        .eq('project_id', project.id)
        .order('ordre', { ascending: true })
    : { data: [] };

  const allPhases = phases || [];
  const doneCount = allPhases.filter((p) => p.statut === 'terminee').length;

  content.innerHTML = `
    <div class="page-header">
      <h1>Timeline du projet</h1>
      <p class="sub">${project?.nom || client?.nom_projet || ''} — ${doneCount} phase${doneCount > 1 ? 's' : ''} terminée${doneCount > 1 ? 's' : ''} sur ${allPhases.length}</p>
    </div>
    <div class="section-card">
      ${allPhases.length === 0 ? `<div class="empty-state">${ICON_DOC}<p>Aucune phase enregistrée pour l'instant.</p></div>` : `
      <div class="timeline">
        ${allPhases.map((p, i) => `
          <div class="timeline-item clickable ${p.statut}" data-phase-id="${p.id}">
            <div class="timeline-rail"><div class="timeline-dot"></div>${i < allPhases.length - 1 ? '<div class="timeline-line"></div>' : ''}</div>
            <div class="timeline-body">
              <div class="timeline-title-row" data-toggle="${p.id}">
                <span class="timeline-title"><span class="timeline-num">${i + 1}.</span>${p.nom_phase}</span>
                <div style="display:flex;align-items:center;gap:10px">
                  <span class="badge ${p.statut}">${p.statut.replace('_', ' ')}</span>
                  ${ICON_CHEVRON}
                </div>
              </div>
              <div class="timeline-meta">${new Date(p.date_maj).toLocaleDateString('fr-FR')}</div>
              <div class="phase-detail hidden" id="detail-${p.id}"></div>
            </div>
          </div>
        `).join('')}
      </div>
      `}
    </div>
  `;

  async function renderPhaseDetail(phaseId) {
    const box = document.getElementById(`detail-${phaseId}`);
    box.innerHTML = '<p class="sub" style="margin:0">Chargement…</p>';

    const [{ data: notes }, { data: files }, { data: tasks }] = await Promise.all([
      supabase.from('project_phase_notes').select('contenu, created_at').eq('phase_id', phaseId).order('created_at', { ascending: false }),
      supabase.from('files').select('id, nom, type, storage_path, date_upload, size_bytes, uploaded_by').eq('phase_id', phaseId).order('date_upload', { ascending: false }),
      supabase.from('project_tasks').select('titre, responsable, delai, fait').eq('phase_id', phaseId).order('created_at', { ascending: true }),
    ]);

    const today = new Date().toISOString().slice(0, 10);

    box.innerHTML = `
      <div class="phase-detail-section">
        <div class="phase-detail-label">Tâches</div>
        <div class="task-list">
          ${(tasks || []).length === 0 ? '<p class="sub" style="margin:0;font-size:13px">Aucune tâche pour l\'instant.</p>' : (tasks || []).map((t) => `
            <div class="task-item">
              <div class="task-check-static ${t.fait ? 'done' : ''}">${t.fait ? ICON_CHECK : ''}</div>
              <div class="task-info">
                <div class="task-title ${t.fait ? 'done' : ''}">${t.titre}</div>
                <div class="task-meta ${!t.fait && t.delai && t.delai < today ? 'overdue' : ''}">${[t.responsable, t.delai ? `échéance ${new Date(t.delai).toLocaleDateString('fr-FR')}` : null].filter(Boolean).join(' · ')}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="phase-detail-section">
        <div class="phase-detail-label">Comptes-rendus</div>
        ${(notes || []).length === 0 ? '<p class="sub" style="margin:0;font-size:13px">Aucune note pour l\'instant.</p>' : (notes || []).map((n) => `
          <div class="note-item">
            <div>${n.contenu}</div>
            <div class="meta">${new Date(n.created_at).toLocaleDateString('fr-FR')}</div>
          </div>
        `).join('')}
      </div>
      <div class="phase-detail-section">
        <div class="phase-detail-label">Fichiers de cette phase</div>
        <div class="file-list" id="phase-files-${phaseId}">
          ${(files || []).length === 0 ? '<p class="sub" style="margin:0;font-size:13px">Aucun fichier.</p>' : (files || []).map((f) => `
            <div class="file-item">
              <div class="file-icon">${fileIcon(f.nom)}</div>
              <div class="file-info">
                <div class="file-name">${f.nom}</div>
                <div class="file-meta">${formatBytes(f.size_bytes)}${f.size_bytes ? ' · ' : ''}${new Date(f.date_upload).toLocaleDateString('fr-FR')}</div>
              </div>
              <div class="file-actions">
                <button class="file-download" data-path="${f.storage_path}" title="Télécharger">${ICON_DOWNLOAD}</button>
                ${f.uploaded_by === userId ? `<button class="file-download file-delete" data-file-id="${f.id}" data-path="${f.storage_path}" title="Supprimer">${ICON_TRASH}</button>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
        <form class="phase-upload-form" data-phase-id="${phaseId}" style="margin-top:14px">
          <input type="file" required style="margin-bottom:10px"/>
          <button type="submit" class="btn-secondary">Ajouter un fichier</button>
        </form>
      </div>
    `;

    box.querySelectorAll('.file-download[data-path]:not(.file-delete)').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const { data, error } = await supabase.storage.from('client-files').createSignedUrl(btn.dataset.path, 60);
        btn.disabled = false;
        if (error || !data) { alert('Impossible de générer le lien de téléchargement.'); return; }
        window.open(data.signedUrl, '_blank');
      });
    });

    box.querySelectorAll('.file-delete').forEach((btn) => {
      wireDeleteConfirm(btn, async () => {
        await supabase.storage.from('client-files').remove([btn.dataset.path]);
        await supabase.from('files').delete().eq('id', btn.dataset.fileId);
        renderPhaseDetail(phaseId);
      });
    });

    box.querySelector('.phase-upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fileInput = form.querySelector('input[type=file]');
      const file = fileInput.files[0];
      if (!file) return;
      const path = `${project.id}/${Date.now()}_${file.name}`;
      const { error: uploadError } = await supabase.storage.from('client-files').upload(path, file);
      if (uploadError) { alert(uploadError.message); return; }
      await supabase.from('files').insert({
        project_id: project.id, phase_id: phaseId, type: 'fichier', nom: file.name,
        storage_path: path, size_bytes: file.size, uploaded_by: userId,
      });
      renderPhaseDetail(phaseId);
    });
  }

  content.querySelectorAll('.timeline-title-row[data-toggle]').forEach((row) => {
    row.addEventListener('click', () => {
      const phaseId = row.dataset.toggle;
      const item = row.closest('.timeline-item');
      const box = document.getElementById(`detail-${phaseId}`);
      const wasHidden = box.classList.contains('hidden');
      box.classList.toggle('hidden');
      item.classList.toggle('expanded', wasHidden);
      if (wasHidden) renderPhaseDetail(phaseId);
    });
  });
}

document.getElementById('logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  window.location.href = '/espace-client/connexion/';
});
document.getElementById('menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
});
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
});
</script>
</body>
</html>
