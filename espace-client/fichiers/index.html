<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fichiers — Espace client</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/espace-client.css?v=12"/>
</head>
<body>
<div class="app-shell">
  <div class="overlay" id="overlay"></div>
  <aside class="app-sidebar" id="sidebar">
    <div class="app-brand">
      <div class="avatar" id="brand-avatar">··</div>
      <div class="app-brand-text">
        <div class="app-brand-name" id="brand-name">Chargement…</div>
        <div class="app-brand-sub" id="brand-sub"></div>
      </div>
    </div>
    <nav class="app-nav">
      <a href="/espace-client/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Tableau de bord
      </a>
      <a href="/espace-client/projet/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="m3 6 1.5 1.5L7 5"/><path d="m3 12 1.5 1.5L7 11"/><path d="m3 18 1.5 1.5L7 17"/></svg>
        Projet
      </a>
      <a href="/espace-client/fichiers/" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
        Fichiers
      </a>
      <a href="/espace-client/devis-factures/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        Devis &amp; factures
      </a>
    </nav>
    <div class="app-sidebar-bottom">
      <a href="#" class="nav-item" id="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Déconnexion
      </a>
    </div>
  </aside>

  <div class="app-main">
    <div class="app-topbar">
      <button class="menu-btn" id="menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
      </button>
      <strong style="font-size:14px">Fichiers</strong>
    </div>
    <div class="app-content">
      <div class="app-content-inner" id="content">
        <p class="sub">Chargement…</p>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { supabase, requireSession } from '/assets/supabase-client.js';

const ICON_IMAGE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 20"/></svg>';
const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>';
const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
const IMAGE_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];
function fileIcon(nom) {
  const ext = (nom.split('.').pop() || '').toLowerCase();
  return IMAGE_EXT.includes(ext) ? ICON_IMAGE : ICON_DOC;
}
function initials(nom) {
  return nom.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
}

// Confirmation de suppression sans dialogue natif (window.confirm bloque tout
// le rendu de la page) : premier clic arme le bouton (rouge, 3s), second clic confirme.
function wireDeleteConfirm(btn, onConfirm) {
  let timeout;
  btn.addEventListener('click', () => {
    if (btn.dataset.armed !== 'true') {
      btn.dataset.armed = 'true';
      btn.classList.add('confirm-armed');
      timeout = setTimeout(() => {
        btn.dataset.armed = 'false';
        btn.classList.remove('confirm-armed');
      }, 3000);
      return;
    }
    clearTimeout(timeout);
    btn.disabled = true;
    onConfirm();
  });
}

// Remplace window.alert (bloquant) par un message non bloquant en bas d'écran.
function showToast(message, type = 'error') {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.className = `toast ${type} show`;
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}
function formatBytes(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  return kb < 1024 ? `${Math.round(kb)} Ko` : `${(kb / 1024).toFixed(1)} Mo`;
}

const session = await requireSession('/espace-client/connexion/');
if (session) {
  const content = document.getElementById('content');
  const userId = session.user.id;

  const { data: client } = await supabase
    .from('clients')
    .select('id, nom, nom_projet')
    .eq('auth_user_id', session.user.id)
    .single();

  if (client) {
    document.getElementById('brand-avatar').textContent = initials(client.nom);
    document.getElementById('brand-name').textContent = client.nom;
    document.getElementById('brand-sub').textContent = client.nom_projet;
  }

  const { data: project } = client
    ? await supabase.from('projects').select('id').eq('client_id', client.id).single()
    : { data: null };

  async function loadAndRender() {
    const { data: files } = project
      ? await supabase
          .from('files')
          .select('id, nom, type, storage_path, date_upload, size_bytes, uploaded_by')
          .eq('project_id', project.id)
          .order('date_upload', { ascending: false })
      : { data: [] };

    const allFiles = files || [];

    content.innerHTML = `
      <div class="page-header">
        <h1>Maquettes &amp; fichiers</h1>
        <p class="sub">${allFiles.length} fichier${allFiles.length > 1 ? 's' : ''} partagé${allFiles.length > 1 ? 's' : ''} sur ce projet</p>
      </div>
      <div class="section-card">
        ${allFiles.length === 0 ? `<div class="empty-state">${ICON_DOC}<p>Aucun fichier pour l'instant.</p></div>` : `
        <div class="file-list">
          ${allFiles.map((f) => `
            <div class="file-item">
              <div class="file-icon">${fileIcon(f.nom)}</div>
              <div class="file-info">
                <div class="file-name">${f.nom}</div>
                <div class="file-meta">${f.type}${f.size_bytes ? ' · ' + formatBytes(f.size_bytes) : ''} · ${new Date(f.date_upload).toLocaleDateString('fr-FR')}</div>
              </div>
              <div class="file-actions">
                <button class="file-download" data-path="${f.storage_path}" title="Télécharger">${ICON_DOWNLOAD}</button>
                ${f.uploaded_by === userId ? `<button class="file-download file-delete" data-file-id="${f.id}" data-path="${f.storage_path}" title="Supprimer">${ICON_TRASH}</button>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
        `}
        <form id="upload-form" style="margin-top:16px">
          <label for="file-input">Ajouter un fichier</label>
          <input type="file" id="file-input" required style="margin-bottom:16px"/>
          <button type="submit" class="btn-primary" id="upload-btn" style="width:auto">Ajouter</button>
        </form>
      </div>
    `;

    content.querySelectorAll('.file-download[data-path]:not(.file-delete)').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const { data, error } = await supabase.storage.from('client-files').createSignedUrl(btn.dataset.path, 60);
        btn.disabled = false;
        if (error || !data) { showToast('Impossible de générer le lien de téléchargement.'); return; }
        window.open(data.signedUrl, '_blank');
      });
    });

    content.querySelectorAll('.file-delete').forEach((btn) => {
      wireDeleteConfirm(btn, async () => {
        await supabase.storage.from('client-files').remove([btn.dataset.path]);
        await supabase.from('files').delete().eq('id', btn.dataset.fileId);
        loadAndRender();
      });
    });

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('upload-btn');
      btn.disabled = true;
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      const path = `${project.id}/${Date.now()}_${file.name}`;

      const { error: uploadError } = await supabase.storage.from('client-files').upload(path, file);
      if (uploadError) {
        showToast(uploadError.message);
        btn.disabled = false;
        return;
      }
      await supabase.from('files').insert({
        project_id: project.id, type: 'fichier', nom: file.name,
        storage_path: path, size_bytes: file.size, uploaded_by: userId,
      });
      btn.disabled = false;
      loadAndRender();
    });
  }

  await loadAndRender();
}

document.getElementById('logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  window.location.href = '/espace-client/connexion/';
});
document.getElementById('menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
});
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
});
</script>
</body>
</html>
