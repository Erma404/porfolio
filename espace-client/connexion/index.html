<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Connexion — Espace client</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/espace-client.css?v=10"/>
<style>
  body.login-split{min-height:100vh;display:flex;margin:0}
  .login-split-form{
    flex:1 1 480px;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;background:var(--surface);position:relative;z-index:1;
  }
  .login-split-form .wrap{padding:0}
  .login-split-visual{
    flex:1 1 480px;position:relative;overflow:hidden;background:var(--bg);
    display:flex;align-items:flex-end;justify-content:center;padding:32px;
  }
  .login-split-brand{
    position:relative;z-index:1;text-align:center;padding:16px 26px;border-radius:14px;
    background:rgba(255,255,255,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.6);
  }
  .login-split-brand-avatar{display:block;width:64px;height:auto;margin:0 auto 10px}
  .login-split-brand-name{display:block;font-family:var(--serif);font-size:19px;color:var(--text)}
  .login-split-brand-sub{display:block;font-size:12.5px;color:var(--text2);margin-top:2px}

  @media(max-width:860px){
    .login-split-visual{display:none}
  }

  /* ── Background blobs (identiques à ernestinematjabo.com) ── */
  .bg-blobs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blob{position:absolute;border-radius:50%}
  .blob-1{
    width:620px;height:620px;background:radial-gradient(circle,rgba(91,76,245,0.88) 0%,transparent 62%);
    top:-160px;left:-140px;filter:blur(22px);animation:blobDrift1 12s ease-in-out infinite alternate;
  }
  .blob-2{
    width:520px;height:520px;background:radial-gradient(circle,rgba(219,39,119,0.72) 0%,transparent 62%);
    bottom:-140px;right:-110px;filter:blur(26px);animation:blobDrift2 9s ease-in-out infinite alternate;
  }
  .blob-3{
    width:420px;height:420px;background:radial-gradient(circle,rgba(124,108,250,0.80) 0%,transparent 62%);
    top:38%;left:50%;filter:blur(30px);animation:blobDrift3 15s ease-in-out infinite alternate;
  }
  .blob-4{
    width:340px;height:340px;background:radial-gradient(circle,rgba(236,72,153,0.60) 0%,transparent 62%);
    top:10%;right:8%;filter:blur(28px);animation:blobDrift4 18s ease-in-out infinite alternate;
  }
  @keyframes blobDrift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(150px,110px) scale(1.28)}}
  @keyframes blobDrift2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-130px,-140px) scale(1.22)}}
  @keyframes blobDrift3{0%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}100%{transform:translate(-18%,-68%) scale(1.32) rotate(28deg)}}
  @keyframes blobDrift4{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-60px,90px) scale(1.18)}}
</style>
</head>
<body class="login-split">
<div class="login-split-form">
  <div class="wrap">
    <h1 style="font-family:var(--serif);font-weight:400;font-size:28px">Espace client</h1>
    <p class="sub">Connectez-vous pour suivre votre projet.</p>

    <div id="msg-box"></div>

    <!-- Étape 1 : email + mot de passe -->
    <form id="login-form" class="card">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email"/>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password"/>
      <button type="submit" class="btn-primary" id="login-btn">Se connecter</button>
    </form>

    <!-- Étape 2 : nouveau mot de passe (première connexion uniquement) -->
    <form id="newpass-form" class="card hidden">
      <p class="sub" style="margin-bottom:16px">Choisissez votre mot de passe définitif.</p>
      <label for="newpass">Nouveau mot de passe</label>
      <input type="password" id="newpass" required minlength="8" autocomplete="new-password"/>
      <button type="submit" class="btn-primary" id="newpass-btn">Définir mon mot de passe</button>
    </form>

    <!-- Bootstrap admin : lien d'invitation Supabase, usage unique -->
    <form id="admin-invite-form" class="card hidden">
      <p class="sub" style="margin-bottom:16px">Compte admin confirmé — définissez votre mot de passe.</p>
      <label for="admin-pass">Mot de passe</label>
      <input type="password" id="admin-pass" required minlength="8" autocomplete="new-password"/>
      <button type="submit" class="btn-primary" id="admin-pass-btn">Définir mon mot de passe admin</button>
    </form>
  </div>
</div>
<div class="login-split-visual" aria-hidden="true">
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="login-split-brand">
    <img src="/assets/img/memoji-ernestine.png" alt="" class="login-split-brand-avatar"/>
    <span class="login-split-brand-name">Ernestine Matjabo</span>
    <span class="login-split-brand-sub">Espace client</span>
  </div>
</div>

<script type="module">
import { supabase, callFunction } from '/assets/supabase-client.js';

const msgBox = document.getElementById('msg-box');
function showMsg(text, type = 'error') {
  msgBox.innerHTML = `<div class="msg ${type}">${text}</div>`;
}
function clearMsg() { msgBox.innerHTML = ''; }

const loginForm = document.getElementById('login-form');
const newpassForm = document.getElementById('newpass-form');

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg();
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) {
    showMsg('Email ou mot de passe incorrect.');
    return;
  }

  if (data.session.user.user_metadata?.must_change_password) {
    loginForm.classList.add('hidden');
    newpassForm.classList.remove('hidden');
  } else {
    window.location.href = '/espace-client/';
  }
});

newpassForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg();
  const btn = document.getElementById('newpass-btn');
  btn.disabled = true;
  const newPassword = document.getElementById('newpass').value;

  const { error } = await supabase.auth.updateUser({
    password: newPassword,
    data: { must_change_password: false },
  });
  if (error) {
    btn.disabled = false;
    showMsg(error.message);
    return;
  }

  try {
    await callFunction('complete-onboarding', {});
  } catch (err) {
    // Le mot de passe est déjà défini ; on n'empêche pas l'accès si cet appel échoue.
    console.error('complete-onboarding error', err);
  }
  window.location.href = '/espace-client/';
});

const ADMIN_EMAIL = 'ernestinemtb@gmail.com';

if (location.hash.includes('type=invite') || location.hash.includes('type=recovery')) {
  const { data: { session } } = await supabase.auth.getSession();
  if (session && session.user.email === ADMIN_EMAIL) {
    loginForm.classList.add('hidden');
    document.getElementById('admin-invite-form').classList.remove('hidden');
  }
} else {
  // Si déjà connectée et onboardée, redirection directe.
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user?.email === ADMIN_EMAIL) {
    window.location.href = '/admin/';
  } else if (session && !session.user.user_metadata?.must_change_password) {
    window.location.href = '/espace-client/';
  }
}

document.getElementById('admin-invite-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('admin-pass-btn');
  btn.disabled = true;
  const { error } = await supabase.auth.updateUser({ password: document.getElementById('admin-pass').value });
  btn.disabled = false;
  if (error) {
    showMsg(error.message);
    return;
  }
  window.location.href = '/admin/';
});
</script>
</body>
</html>
